[project]
name = "orderlane"
version = "0.1.0"
description = "AI agent that turns WhatsApp text and voice orders into reviewed sales orders"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "httpx>=0.27",
    "structlog>=24.1",
    "pwdlib[argon2]>=0.2",
    "rapidfuzz>=3.9",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "openai>=1.50",
    "psycopg[binary,pool]>=3.2",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20260906",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "evals"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["arq.*", "reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ReportLab has no type hints.
module = ["app.services.invoice_pdf"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: needs a PostgreSQL database (set TEST_DATABASE_URL)"]

[tool.coverage.run]
source = ["app"]
