# Shopping tasks shown to volunteers (see docs/dataset-form.md).
# Each task's "gold" is the correct answer, so most labeling is already done:
# you only check that the person did what the task asked.
#
# intents: the expected intent of each message the person sends, in order.
# final_lines: the correct open order after all messages (empty if cancelled or a question).
# Quantities are compared in base units (pieces) by the evaluator, so
# "half a carton of 12" and "6 pieces" both count as correct.
# sku: null means the request is ambiguous and the correct outcome is staff review.

- id: A01
  form: A
  channel: text
  instruction: Order 5 cartons of the big (950 gram) Tapal Danedar tea.
  gold:
    intents: [new_order]
